[package]
name = "ai-audiobook-win-spike"
version = "1.0.0"
description = "AI Audiobook Windows spike - Tauri shell validation (template-derived)"
authors = ["Spike"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
