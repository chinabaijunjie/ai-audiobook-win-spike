name: Windows Spike

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 第一批：CosyVoice 全量依赖在 Windows x64 的安装验证（spike 核心命题）
  deps-spike:
    name: CosyVoice 依赖逐包安装（Windows x64）
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10（对齐本地 cosyvoice 环境）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 CPU torch + torchaudio（专用 index）
        run: |
          pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda:', torch.cuda.is_available())"

      - name: 全量依赖逐包安装（失败继续，记录每包结果）
        shell: pwsh
        run: ./scripts/install-deps.ps1

      - name: 上传失败清单（如有）
        if: hashFiles('failed-packages.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: failed-packages
          path: failed-packages.txt

  # 第二批：Tauri 最小壳 → x64 NSIS 安装包（模板派生壳出包链路验证）
  tauri-nsis:
    name: Tauri 壳 → NSIS x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 前端依赖安装
        run: npm install

      - name: Tauri build（x64 NSIS）
        run: npx tauri build

      - name: 列出打包产物
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: nsis-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
